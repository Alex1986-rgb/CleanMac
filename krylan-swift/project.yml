# XcodeGen-конфиг. Установка и генерация проекта:
#   brew install xcodegen
#   cd krylan-swift && xcodegen generate && open KRYLAN.xcodeproj
name: KRYLAN
options:
  bundleIdPrefix: com.krylan
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    DEVELOPMENT_TEAM: ""   # ← впишите свой Apple Team ID после регистрации
targets:
  KRYLAN-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: ["Widget/**"]
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krylan.app
        PRODUCT_NAME: KRYLAN
    info:
      path: Generated-macOS-Info.plist
      properties:
        CFBundleDisplayName: KRYLAN
        NSPhotoLibraryUsageDescription: "KRYLAN ищет дубликаты фотографий в вашей медиатеке."
        NSContactsUsageDescription: "KRYLAN ищет дубликаты контактов."
  KRYLAN-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ["Widget/**"]
      - Assets.xcassets
    dependencies:
      - target: KRYLAN-Widget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krylan.app
        PRODUCT_NAME: KRYLAN
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Generated-iOS-Info.plist
      properties:
        CFBundleDisplayName: KRYLAN
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "KRYLAN ищет дубликаты фотографий в вашей медиатеке."
        NSContactsUsageDescription: "KRYLAN ищет дубликаты контактов."
  KRYLAN-Widget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krylan.app.widget
        PRODUCT_NAME: KrylanWidget
        SKIP_INSTALL: true
    info:
      path: Generated-Widget-Info.plist
      properties:
        CFBundleDisplayName: KRYLAN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
